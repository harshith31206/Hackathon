<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Demo Application</title>
    <style>
      body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
      .app-header { text-align: center; margin-bottom: 24px; }
      .app-header h1 { font-size: 1.75rem; font-weight: 700; color: #f8fafc; margin: 0 0 4px 0; }
      .app-header p { font-size: 0.9rem; color: #94a3b8; margin: 0; }
      .login-card { background: #1e293b; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 360px; border: 1px solid rgba(255,255,255,0.1); box-sizing: border-box; }
      .login-card h2 { margin-top: 0; margin-bottom: 20px; text-align: center; color: #38bdf8; }
      .form-group { margin-bottom: 16px; }
      .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #94a3b8; }
      .form-group input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
      .btn-submit { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #0284c7; color: #fff; font-weight: 600; cursor: pointer; transition: background 0.2s; }
      .btn-submit:hover { background: #0369a1; }
      .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #475569; font-size: 0.8rem; }
      .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #334155; }
      .divider::before { margin-right: .5em; }
      .divider::after { margin-left: .5em; }
      .btn-social { width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #f8fafc; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s, border-color 0.2s; }
      .btn-social:hover { background: #1e293b; border-color: #475569; }
    </style>
  </head>
  <body>
    <header class="app-header">
      <h1>Demo Application</h1>
      <p>Secure Enterprise Portal</p>
    </header>
    <div class="login-card">
      <h2>Welcome Back</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email / Username</label>
          <input type="email" id="email" required placeholder="user@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
      </form>
      <div class="divider">or</div>
      <button type="button" class="btn-social">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" fill="#4285F4"/>
          <path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.19v3.15C3.17 21.36 7.23 24 12 24z" fill="#34A853"/>
          <path d="M5.28 14.25c-.25-.72-.39-1.5-.39-2.25s.14-1.53.39-2.25V6.6H1.19C.43 8.13 0 9.87 0 12s.43 3.87 1.19 5.4l4.09-3.15z" fill="#FBBC05"/>
          <path d="M12 4.75c1.76 0 3.34.61 4.58 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.64 1.19 6.6l4.09 3.15c.95-2.84 3.6-4.95 6.72-4.95z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
    </div>
  </body>
</html>
